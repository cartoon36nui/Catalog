<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOMATSU Forklift Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f; --bg2: #111418; --bg3: #181c22;
            --border: #252a32; --border2: #3a424f;
            --acc: #f5a623; --text: #e8ecf2; --dim: #8a95a3;
            --faint: #4a5360; --gas: #4ade80; --diesel: #60a5fa;
            --elec: #a78bfa; --red: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 17px; min-height: 100vh; overflow-x: hidden; }

        /* Header */
        header { 
            position: sticky; top: 0; z-index: 100; background: rgba(10, 12, 15, 0.95); 
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); 
            padding: 0 20px; display: flex; align-items: center; height: 70px; 
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--acc); cursor: pointer; }
        .logo span { color: var(--dim); font-size: 15px; font-family: 'Sarabun', sans-serif; letter-spacing: 1px; margin-left: 10px; }

        #cmp-badge { 
            display: none; background: var(--acc); color: #000; font-weight: 700; 
            font-size: 15px; padding: 10px 20px; border-radius: 30px; cursor: pointer; 
            border: none; margin-left: auto; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(245,166,35,0.3);
        }
        #cmp-badge.on { display: inline-flex; }

        /* Filter Bar */
        .fbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
        .sw { position: relative; flex: 1; min-width: 300px; max-width: 450px; }
        #search { 
            width: 100%; background: var(--bg3); border: 1px solid var(--border); 
            border-radius: 10px; color: var(--text); font-size: 17px; padding: 12px 15px 12px 45px; outline: none; transition: 0.2s;
        }
        #search:focus { border-color: var(--acc); }
        .sw svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: .5; }

        /* History */
        #search-history {
            position: absolute; top: 105%; left: 0; right: 0; background: var(--bg3); 
            border: 1px solid var(--border2); border-radius: 10px; z-index: 50; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden;
        }
        .history-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 15px; transition: 0.2s; }
        .history-item:hover { background: var(--border); color: var(--acc); }

        .chips { display: flex; flex-wrap: wrap; gap: 10px; }
        .chip { padding: 8px 18px; border-radius: 25px; border: 1px solid var(--border2); background: transparent; color: var(--dim); font-size: 15px; cursor: pointer; transition: 0.2s; }
        .chip:hover { border-color: var(--acc); }
        .chip.on { background: var(--acc); color: #000; font-weight: 600; border-color: var(--acc); }

        /* Grid & Cards */
        .gw { padding: 25px; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { 
            background: #1a1f28; border: 1px solid var(--border); border-radius: 15px; 
            padding: 22px; cursor: pointer; position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { transform: translateY(-5px); border-color: var(--acc); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .card.sel { border-color: var(--acc); background: rgba(245,166,35,0.08); box-shadow: inset 0 0 0 1px var(--acc); }

        .mn { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; margin-bottom: 5px; }
        .eb { font-size: 12px; padding: 4px 12px; border-radius: 15px; font-weight: 700; }
        .eb.gas { background: rgba(74,222,128,.15); color: var(--gas); }
        .eb.diesel { background: rgba(96,165,250,.15); color: var(--diesel); }
        .eb.elec { background: rgba(167,139,250,.15); color: var(--elec); }

        /* Modal (Fixed Header & Close) */
        .ov { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.9); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px; }
        .ov.open { display: flex; }
        .mdl { 
            background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px; 
            width: 100%; max-width: 850px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        .mdl-head { 
            padding: 25px 30px; border-bottom: 1px solid var(--border); background: var(--bg3); 
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
        }
        .mdl-body { padding: 30px; overflow-y: auto; flex: 1; }
        .mc { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }

        /* Compare Table */
        #cp { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: none; flex-direction: column; }
        #cp.open { display: flex; }
        .cph { padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 20px; background: var(--bg2); }
        .btn-clear { background: var(--red); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        .cpb { flex: 1; overflow: auto; padding: 30px; }
        table { border-collapse: collapse; width: 100%; min-width: 1000px; }
        th, td { border: 1px solid var(--border); padding: 16px; font-size: 15px; text-align: left; }
        th { background: var(--bg3); color: var(--acc); position: sticky; top: 0; z-index: 5; font-size: 17px; }
        tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

        .loader { text-align: center; padding: 100px; font-size: 20px; color: var(--acc); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">KOMATSU <span>FORKLIFT CATALOG</span></div>
    <button id="cmp-badge" onclick="openCp()">⚖ <span id="cc">0</span> รุ่น — เปรียบเทียบ</button>
</header>

<div class="fbar">
    <div class="sw">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" type="text" placeholder="ค้นหาชื่อรุ่นรถยก..." oninput="doF()" onfocus="showHistory()" autocomplete="off">
        <div id="search-history"></div>
    </div>
    <div class="chips">
        <button class="chip on" onclick="setE('all',this)">ทั้งหมด</button>
        <button class="chip" onclick="setE('เบนซิน',this)">⛽ เบนซิน</button>
        <button class="chip" onclick="setE('ดีเซล',this)">🛢️ ดีเซล</button>
        <button class="chip" onclick="setE('ไฟฟ้า',this)">⚡ ไฟฟ้า</button>
    </div>
    <span id="cnt" style="margin-left:auto; font-size: 15px; color: var(--faint);">กำลังดึงข้อมูล...</span>
</div>

<div class="gw"><div id="grid"><div class="loader">กำลังเชื่อมต่อ Google Sheets...</div></div></div>

<!-- Modal Detail -->
<div class="ov" id="ov" onclick="if(event.target===this)closeMdl()">
    <div class="mdl">
        <div class="mdl-head">
            <div id="mdl-title-area"></div>
            <button class="mc" onclick="closeMdl()">✕ ปิดหน้าต่าง</button>
        </div>
        <div class="mdl-body" id="mb"></div>
    </div>
</div>

<!-- Comparison View -->
<div id="cp">
    <div class="cph">
        <div class="logo">SPEC COMPARISON</div>
        <button class="btn-clear" onclick="clearCmp()">ล้างข้อมูล & กลับหน้าหลัก</button>
        <button class="mc" style="margin-left:auto; background:var(--bg3)" onclick="closeCp()">✕ ปิด</button>
    </div>
    <div class="cpb" id="cpb-table"></div>
</div>

<script>
const SHEET_ID = '16A8YKMB1zLaURJH0cjZHR-MXdaIca_5kYRuilNIH-nw';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

let RAW_DATA = [];
let curE = 'all', curQ = '', cmpSet = new Set();
let searchHistory = JSON.parse(localStorage.getItem('fork_search_history') || '[]');

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        // แปลงข้อมูลจาก Google JSON ให้เป็น Object ที่ใช้งานง่าย
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const headers = json.table.cols.map(c => c.label).filter(l => l !== "");
        
        RAW_DATA = json.table.rows.map(row => {
            let item = { spec: {} };
            row.c.forEach((cell, i) => {
                const val = cell ? cell.v : '-';
                const key = headers[i];
                if (key === 'รุ่น' || key === 'Model') item.name = String(val);
                if (key === 'ประเภทพลังงาน') item.energy = String(val);
                if (key) item.spec[key] = val;
            });
            return item;
        }).filter(item => item.name && item.name !== '-');

        render();
    } catch (e) {
        document.getElementById('grid').innerHTML = `
            <div class="loader" style="color:var(--red)">
                ⚠ ไม่สามารถโหลดข้อมูลได้<br>
                <small style="color:var(--dim); font-weight:normal">โปรดตรวจสอบว่าได้กด "Publish to web" ใน Google Sheets แล้ว</small>
            </div>`;
    }
}

function render() {
    const list = RAW_DATA.filter(m => 
        (curE === 'all' || (m.energy && m.energy.includes(curE))) && 
        (!curQ || (m.name && m.name.toLowerCase().includes(curQ.toLowerCase())))
    );
    
    document.getElementById('cnt').textContent = list.length + ' รุ่น';
    const g = document.getElementById('grid');
    
    if (list.length === 0) {
        g.innerHTML = `<div class="loader" style="color:var(--dim)">ไม่พบข้อมูลที่ค้นหา</div>`;
        return;
    }

    g.innerHTML = list.map(m => {
        const isSelected = cmpSet.has(m.name);
        return `
            <div class="card ${isSelected ? 'sel' : ''}" onclick="openMdl('${m.name}')">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
                    <div class="mn">${m.name}</div>
                    <span class="eb ${getEC(m.energy)}">${m.energy || 'N/A'}</span>
                </div>
                <div style="font-size:15px; color:var(--dim); line-height:1.8">
                    <div>• น้ำหนักยก: <strong style="color:var(--text)">${m.spec['น้ำหนักของสัมภาระที่ยกได้สูงสุด(Q)กก.'] || '-'}</strong> กก.</div>
                    <div>• วงเลี้ยว: <strong style="color:var(--text)">${m.spec['วงเลี้ยว (Wa) มม.'] || '-'}</strong> มม.</div>
                </div>
                <div style="margin-top:18px; display:flex; gap:10px;">
                    <button class="chip ${isSelected ? 'on' : ''}" style="flex:1; font-size:13px;" onclick="event.stopPropagation(); togCmp('${m.name}')">
                        ${isSelected ? '✓ เลือกแล้ว' : '+ เปรียบเทียบ'}
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

function getEC(e) {
    if(!e) return '';
    if(e.includes('เบนซิน')) return 'gas';
    if(e.includes('ดีเซล')) return 'diesel';
    if(e.includes('ไฟฟ้า')) return 'elec';
    return '';
}

function showHistory() {
    if (searchHistory.length === 0) return;
    const hBox = document.getElementById('search-history');
    hBox.innerHTML = searchHistory.map(h => `<div class="history-item" onclick="useHistory('${h}')">🕒 ${h}</div>`).join('');
    hBox.style.display = 'block';
}

function useHistory(val) {
    document.getElementById('search').value = val;
    curQ = val;
    document.getElementById('search-history').style.display = 'none';
    render();
}

function doF() {
    curQ = document.getElementById('search').value;
    if (curQ.length > 2) {
        if (!searchHistory.includes(curQ)) {
            searchHistory.unshift(curQ);
            searchHistory = searchHistory.slice(0, 5);
            localStorage.setItem('fork_search_history', JSON.stringify(searchHistory));
        }
    }
    render();
}

function setE(v, el) {
    curE = v;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    render();
}

function openMdl(name) {
    const m = RAW_DATA.find(x => x.name === name);
    if (!m) return;
    
    document.getElementById('mdl-title-area').innerHTML = `
        <div class="mn" style="font-size:26px; color:var(--acc)">${m.name}</div>
        <div style="font-size:15px; color:var(--dim)">${m.energy} Forklift Technical Specifications</div>
    `;

    let html = '<div style="display:grid; gap:2px;">';
    Object.entries(m.spec).forEach(([k, v]) => {
        if(k !== 'Model' && k !== 'รุ่น' && v !== '-' && v !== '') {
            html += `
            <div style="display:flex; justify-content:space-between; padding:15px; background:rgba(255,255,255,0.03); border-bottom:1px solid var(--border); align-items:center;">
                <span style="color:var(--dim); font-size:16px; flex:1;">${k}</span>
                <span style="font-weight:600; text-align:right; flex:1; color:var(--text);">${v}</span>
            </div>`;
        }
    });
    html += '</div>';

    document.getElementById('mb').innerHTML = html;
    document.getElementById('ov').classList.add('open');
}

function closeMdl() { document.getElementById('ov').classList.remove('open'); }

function togCmp(name) {
    if (cmpSet.has(name)) {
        cmpSet.delete(name);
    } else {
        if (cmpSet.size < 4) cmpSet.add(name);
        else alert("สามารถเปรียบเทียบได้สูงสุด 4 รุ่นพร้อมกัน");
    }
    document.getElementById('cc').textContent = cmpSet.size;
    document.getElementById('cmp-badge').classList.toggle('on', cmpSet.size > 0);
    render();
}

function openCp() {
    const sel = [...cmpSet].map(n => RAW_DATA.find(m => m.name === n));
    if (sel.length === 0) return;

    const allKeys = Object.keys(RAW_DATA[0].spec);
    
    let html = `<table><thead><tr><th>สเปค / รุ่น</th>`;
    sel.forEach(s => html += `<th style="text-align:center">${s.name}<br><small style="color:var(--dim)">${s.energy}</small></th>`);
    html += `</tr></thead><tbody>`;
    
    allKeys.forEach(k => {
        if(k === 'รุ่น' || k === 'Model') return;
        html += `<tr><td style="color:var(--dim); font-weight:bold; background:var(--bg2)">${k}</td>`;
        sel.forEach(s => {
            html += `<td style="text-align:center">${s.spec[k] || '-'}</td>`;
        });
        html += `</tr>`;
    });
    
    html += `</tbody></table>`;
    document.getElementById('cpb-table').innerHTML = html;
    document.getElementById('cp').classList.add('open');
}

function closeCp() { document.getElementById('cp').classList.remove('open'); }

function clearCmp() {
    cmpSet.clear();
    document.getElementById('cc').textContent = 0;
    document.getElementById('cmp-badge').classList.remove('on');
    closeCp();
    goHome();
}

function goHome() {
    curE = 'all';
    curQ = '';
    document.getElementById('search').value = '';
    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('on', c.innerText.includes('ทั้งหมด'));
    });
    render();
}

// ปิด History เมื่อคลิกที่อื่น
document.onclick = (e) => {
    if (!e.target.closest('.sw')) document.getElementById('search-history').style.display = 'none';
};

// เริ่มโหลดข้อมูล
loadData();
</script>
</body>
</html>
