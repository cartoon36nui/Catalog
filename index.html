<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOMATSU Forklift Catalog (Fixed)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f; --bg2: #111418; --bg3: #181c22;
            --border: #252a32; --border2: #3a424f;
            --acc: #f5a623; --text: #e8ecf2; --dim: #8a95a3;
            --faint: #4a5360; --gas: #4ade80; --diesel: #60a5fa;
            --elec: #a78bfa; --red: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 16px; min-height: 100vh; }

        header { 
            position: sticky; top: 0; z-index: 100; background: rgba(10, 12, 15, 0.95); 
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); 
            padding: 0 20px; display: flex; align-items: center; height: 64px; 
        }

        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--acc); cursor: pointer; }
        .logo span { color: var(--dim); font-size: 14px; font-family: 'Sarabun', sans-serif; letter-spacing: 1px; }

        #cmp-badge { 
            display: none; background: var(--acc); color: #000; font-weight: 700; 
            font-size: 14px; padding: 8px 16px; border-radius: 20px; cursor: pointer; 
            border: none; margin-left: auto; align-items: center; gap: 8px; 
        }
        #cmp-badge.on { display: inline-flex; }

        .fbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
        .sw { position: relative; flex: 1; min-width: 280px; max-width: 400px; }
        #search { 
            width: 100%; background: var(--bg3); border: 1px solid var(--border); 
            border-radius: 8px; color: var(--text); font-size: 16px; padding: 10px 12px 10px 40px; outline: none; 
        }
        .sw svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .4; }

        #search-history {
            position: absolute; top: 105%; left: 0; right: 0; background: var(--bg3); 
            border: 1px solid var(--border2); border-radius: 8px; z-index: 50; display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .history-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .history-item:hover { background: var(--border); color: var(--acc); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--dim); font-size: 14px; cursor: pointer; }
        .chip.on { background: var(--acc); color: #000; font-weight: 600; border-color: var(--acc); }

        .gw { padding: 20px; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

        .card { 
            background: #1a1f28; border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; cursor: pointer; position: relative; transition: all 0.2s;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--border2); }
        .card.sel { border-color: var(--acc); background: rgba(245,166,35,0.05); }
        .card.sel::after { content: '✓ Selected'; position: absolute; top: 10px; right: 10px; font-size: 10px; color: var(--acc); font-weight: bold; }

        .mn { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; }
        .eb { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 700; text-transform: uppercase; }
        .eb.gas { background: rgba(74,222,128,.1); color: var(--gas); }
        .eb.diesel { background: rgba(96,165,250,.1); color: var(--diesel); }
        .eb.elec { background: rgba(167,139,250,.1); color: var(--elec); }

        /* Modal Settings */
        .ov { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 20px; }
        .ov.open { display: flex; }
        .mdl { 
            background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; 
            width: 100%; max-width: 800px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        .mdl-head { 
            padding: 20px 28px; border-bottom: 1px solid var(--border); background: var(--bg2); 
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
        }
        .mdl-body { padding: 20px 28px; overflow-y: auto; flex: 1; }
        .mc { background: var(--bg3); border: 1px solid var(--border); color: var(--dim); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 18px; }

        /* Comparison */
        #cp { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: none; flex-direction: column; }
        #cp.open { display: flex; }
        .cph { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; background: var(--bg2); }
        .btn-clear { background: var(--red); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-family: 'Sarabun'; }
        
        .cpb { flex: 1; overflow: auto; padding: 20px; }
        table { border-collapse: collapse; width: 100%; min-width: 800px; }
        th, td { border: 1px solid var(--border); padding: 14px; font-size: 14px; text-align: left; }
        th { background: var(--bg3); color: var(--acc); position: sticky; top: 0; z-index: 5; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .loader { text-align: center; padding: 100px; font-size: 18px; color: var(--acc); }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">KOMATSU <span>FORKLIFT CATALOG</span></div>
    <button id="cmp-badge" onclick="openCp()">⚖ <span id="cc">0</span> รุ่น — เปรียบเทียบ</button>
</header>

<div class="fbar">
    <div class="sw">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" type="text" placeholder="พิมพ์ชื่อรุ่น..." oninput="doF()" onfocus="showHistory()">
        <div id="search-history"></div>
    </div>
    <div class="chips">
        <button class="chip on" onclick="setE('all',this)">ทั้งหมด</button>
        <button class="chip" onclick="setE('เบนซิน',this)">⛽ เบนซิน</button>
        <button class="chip" onclick="setE('ดีเซล',this)">🛢️ ดีเซล</button>
        <button class="chip" onclick="setE('ไฟฟ้า',this)">⚡ ไฟฟ้า</button>
    </div>
    <span id="cnt" style="margin-left:auto; font-size: 14px; color: var(--faint);">กำลังโหลด...</span>
</div>

<div class="gw"><div id="grid"><div class="loader">กำลังดึงข้อมูลล่าสุด...</div></div></div>

<!-- Modal Detail -->
<div class="ov" id="ov" onclick="if(event.target===this)closeMdl()">
    <div class="mdl">
        <div class="mdl-head">
            <div id="mdl-title-area"></div>
            <button class="mc" onclick="closeMdl()">✕ ปิดหน้าต่าง</button>
        </div>
        <div class="mdl-body" id="mb"></div>
    </div>
</div>

<!-- Comparison View -->
<div id="cp">
    <div class="cph">
        <div class="logo">SPEC COMPARISON</div>
        <button class="btn-clear" onclick="clearCmp()">ล้างข้อมูล & กลับหน้าหลัก</button>
        <button class="mc" style="margin-left:auto" onclick="closeCp()">✕ ปิด</button>
    </div>
    <div class="cpb" id="cpb-table"></div>
</div>

<script>
const SHEET_ID = '16A8YKMB1zLaURJH0cjZHR-MXdaIca_5kYRuilNIH-nw';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

let RAW_DATA = [];
let curE = 'all', curQ = '', cmpSet = new Set();
let history = JSON.parse(localStorage.getItem('fork_history') || '[]');

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        
        const headers = json.table.cols.map(c => c.label).filter(l => l !== "");
        RAW_DATA = json.table.rows.map(row => {
            let item = { spec: {} };
            row.c.forEach((cell, i) => {
                const val = cell ? cell.v : '-';
                const key = headers[i];
                if (key === 'รุ่น' || key === 'Model') item.name = String(val);
                if (key === 'ประเภทพลังงาน') item.energy = String(val);
                item.spec[key] = val;
            });
            return item;
        }).filter(item => item.name); // กรองแถวว่าง

        render();
    } catch (e) {
        console.error(e);
        document.getElementById('grid').innerHTML = `<div class="loader" style="color:var(--red)">ไม่สามารถโหลดข้อมูลได้</div>`;
    }
}

function render() {
    const list = RAW_DATA.filter(m => 
        (curE === 'all' || m.energy === curE) && 
        (!curQ || m.name.toLowerCase().includes(curQ.toLowerCase()))
    );
    
    document.getElementById('cnt').textContent = list.length + ' รุ่น';
    const g = document.getElementById('grid');
    
    g.innerHTML = list.map(m => {
        // แก้ไข Logic การ Highlight: ใช้ชื่อรุ่นตรงๆ ในการเช็ค
        const isSelected = cmpSet.has(m.name);
        return `
            <div class="card ${isSelected ? 'sel' : ''}" onclick="handleCardClick('${m.name}')">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
                    <div class="mn">${m.name}</div>
                    <span class="eb ${getEC(m.energy)}">${m.energy}</span>
                </div>
                <div style="font-size:14px; color:var(--dim); line-height:1.6">
                    <div>น้ำหนักยก: <span style="color:var(--text)">${m.spec['น้ำหนักของสัมภาระที่ยกได้สูงสุด(Q)กก.'] || '-'} กก.</span></div>
                    <div>วงเลี้ยว: <span style="color:var(--text)">${m.spec['วงเลี้ยว (Wa) มม.'] || '-'} มม.</span></div>
                </div>
                <div style="margin-top:15px; display:flex; gap:8px;">
                    <button class="chip" style="flex:1; border-color:var(--acc); color:var(--acc)" onclick="event.stopPropagation(); togCmp('${m.name}')">
                        ${isSelected ? '✓ ยกเลิก' : '+ เปรียบเทียบ'}
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

function handleCardClick(name) {
    openMdl(name);
}

function getEC(e) {
    if(e.includes('เบนซิน')) return 'gas';
    if(e.includes('ดีเซล')) return 'diesel';
    return 'elec';
}

function showHistory() {
    if (history.length === 0) return;
    const hBox = document.getElementById('search-history');
    hBox.innerHTML = history.map(h => `<div class="history-item" onclick="useHistory('${h}')">🕒 ${h}</div>`).join('');
    hBox.style.display = 'block';
}

function useHistory(val) {
    document.getElementById('search').value = val;
    curQ = val;
    document.getElementById('search-history').style.display = 'none';
    render();
}

function doF() {
    curQ = document.getElementById('search').value;
    if (curQ.length > 2 && !history.includes(curQ)) {
        history.unshift(curQ);
        history = history.slice(0, 5);
        localStorage.setItem('fork_history', JSON.stringify(history));
    }
    render();
}

function setE(v, el) {
    curE = v;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    render();
}

function openMdl(name) {
    const m = RAW_DATA.find(x => x.name === name);
    if (!m) return;
    
    document.getElementById('mdl-title-area').innerHTML = `
        <div class="mn" style="font-size:24px; color:var(--acc)">${m.name}</div>
        <div style="font-size:14px; color:var(--dim)">ข้อมูลทางเทคนิค | ${m.energy}</div>
    `;

    let html = '<div style="display:grid; gap:2px;">';
    Object.entries(m.spec).forEach(([k, v]) => {
        if(k !== 'Model' && k !== 'รุ่น' && v !== '-') {
            html += `<div style="display:flex; justify-content:space-between; padding:12px; background:rgba(255,255,255,0.02); border-bottom:1px solid var(--border)">
                <span style="color:var(--dim); font-size:15px;">${k}</span>
                <span style="font-weight:500; text-align:right; margin-left:20px;">${v}</span>
            </div>`;
        }
    });
    html += '</div>';

    document.getElementById('mb').innerHTML = html;
    document.getElementById('ov').classList.add('open');
}

function closeMdl() { document.getElementById('ov').classList.remove('open'); }

function togCmp(name) {
    if (cmpSet.has(name)) {
        cmpSet.delete(name);
    } else {
        if (cmpSet.size < 4) {
            cmpSet.add(name);
        } else {
            alert("เปรียบเทียบได้สูงสุด 4 รุ่น");
        }
    }
    document.getElementById('cc').textContent = cmpSet.size;
    document.getElementById('cmp-badge').classList.toggle('on', cmpSet.size > 0);
    render();
}

function openCp() {
    const sel = [...cmpSet].map(n => RAW_DATA.find(m => m.name === n));
    if (sel.length === 0) return;

    const headers = Object.keys(RAW_DATA[0].spec);
    
    let html = `<table><thead><tr><th>รายการสเปค</th>`;
    sel.forEach(s => html += `<th style="text-align:center">${s.name}<br><small>${s.energy}</small></th>`);
    html += `</tr></thead><tbody>`;
    
    headers.forEach(k => {
        if(k === 'รุ่น' || k === 'Model') return;
        html += `<tr><td style="color:var(--dim); font-weight:500;">${k}</td>`;
        sel.forEach(s => {
            html += `<td style="text-align:center">${s.spec[k] || '-'}</td>`;
        });
        html += `</tr>`;
    });
    
    html += `</tbody></table>`;
    document.getElementById('cpb-table').innerHTML = html;
    document.getElementById('cp').classList.add('open');
}

function closeCp() { document.getElementById('cp').classList.remove('open'); }

function clearCmp() {
    cmpSet.clear();
    document.getElementById('cc').textContent = 0;
    document.getElementById('cmp-badge').classList.remove('on');
    closeCp();
    goHome();
}

function goHome() {
    curE = 'all';
    curQ = '';
    document.getElementById('search').value = '';
    document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('on', c.innerText === 'ทั้งหมด');
    });
    render();
}

document.onclick = (e) => {
    if (!e.target.closest('.sw')) document.getElementById('search-history').style.display = 'none';
};

loadData();
</script>
</body>
</html>
