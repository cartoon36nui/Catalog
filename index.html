<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMATSU Catalog - Fixed Final</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--bg2:#111418;--bg3:#181c22;--border:#252a32;--border2:#3a424f;--acc:#f5a623;--text:#e8ecf2;--dim:#8a95a3;--faint:#4a5360;--gas:#4ade80;--diesel:#60a5fa;--elec:#a78bfa;--red:#f87171;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:16px;min-height:100vh;}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(10,12,15,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:64px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--acc);}
#cmp-badge{display:none;background:var(--acc);color:#000;font-weight:700;font-size:14px;padding:8px 18px;border-radius:20px;cursor:pointer;border:none;align-items:center;gap:8px;margin-left:auto;}
#cmp-badge.on{display:inline-flex;}

/* SEARCH & HISTORY */
.fbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:15px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:15px;}
.sw{position:relative;flex:1;min-width:280px;max-width:400px;}
#search{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:16px;padding:10px 12px 10px 40px;outline:none;}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4;z-index:2;}
#search-history{position:absolute;top:100%;left:0;right:0;background:var(--bg3);border:1px solid var(--border2);border-radius:0 0 8px 8px;display:none;z-index:50;box-shadow:0 10px 20px rgba(0,0,0,.5);}
.hist-item{padding:12px 15px;cursor:pointer;border-bottom:1px solid var(--border);font-size:15px;color:var(--dim);}
.hist-item:hover{background:var(--bg2);color:var(--acc);}

.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{padding:8px 20px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--dim);font-size:15px;cursor:pointer;}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600;}

/* CARD UI */
.gw{padding:25px;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.card{background:#1a1f28;border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;}
.card:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:0 10px 25px rgba(0,0,0,0.5);}
.card.sel{border-color:var(--acc);background:rgba(245,166,35,.05);}

.card-title{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;color:var(--text);margin-bottom:4px;}
.card-energy{font-size:14px;color:var(--acc);font-weight:500;margin-bottom:15px;display:block;}

.spec-item{margin-bottom:8px;}
.spec-label{font-size:13px;color:var(--faint);display:block;}
.spec-value{font-size:15px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-weight:500;}

.card-btns{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:15px;border-top:1px solid var(--border);}
.btn-text{color:var(--dim);font-size:14px;text-decoration:underline;cursor:pointer;background:none;border:none;}
.btn-add-cmp{border:1px solid var(--border2);background:none;color:var(--dim);padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;}
.btn-add-cmp.on{background:var(--acc);border-color:var(--acc);color:#000;font-weight:bold;}

/* MODAL & FREEZE HEADER */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;}
.ov.open{display:flex;}
.mdl{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:800px;max-height:85vh;overflow-y:auto;position:relative;}
.mdl-header{position:sticky;top:0;background:var(--bg2);padding:18px 25px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.mdl-content{padding:25px;}

/* COMPARE PAGE */
#cp{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);}
#cp.open{transform:none;}
.cph{position:sticky;top:0;z-index:10;background:var(--bg2);padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:15px;}
.btn-clear{background:transparent;border:1px solid var(--red);color:var(--red);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;margin-left:auto;}

table{border-collapse:collapse;width:100%;min-width:600px;}
th,td{border:1px solid var(--border);padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:14px;}
th{background:var(--bg3);color:var(--acc);position:sticky;top:0;text-align:left;}
td:first-child{font-family:'Sarabun',sans-serif;color:var(--dim);width:240px;background:var(--bg2);}

#loading{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>กำลังซิงค์ข้อมูลสเปค...</p></div>

<header>
  <div class="logo">KOMATSU <span>LIVE CATALOG</span></div>
  <button id="cmp-badge" onclick="openCp()">⚖ <span id="cc">0</span> รุ่น — เปรียบเทียบ</button>
</header>

<div class="fbar">
  <div class="sw">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="ค้นหาชื่อรุ่น..." oninput="doF()" onfocus="showHist()" onblur="hideHist()">
    <div id="search-history"></div>
  </div>
  <div class="chips">
    <button class="chip on" onclick="setE('all',this)">ทั้งหมด</button>
    <button class="chip" onclick="setE('เบนซิน',this)">⛽ เบนซิน</button>
    <button class="chip" onclick="setE('ดีเซล',this)">🛢️ ดีเซล</button>
    <button class="chip" onclick="setE('ไฟฟ้า',this)">⚡ ไฟฟ้า</button>
  </div>
  <span id="cnt" style="margin-left:auto; color:var(--faint)">—</span>
</div>

<div class="gw"><div id="grid"></div></div>

<div class="ov" id="ov" onclick="if(event.target===this)closeMdl()">
  <div class="mdl">
    <div class="mdl-header">
      <div id="mt" style="font-family:'JetBrains Mono'; font-size:24px; color:var(--acc)">-</div>
      <button class="mc" style="background:var(--bg3); border:1px solid var(--border); color:var(--dim); padding:5px 12px; cursor:pointer;" onclick="closeMdl()">✕ ปิด</button>
    </div>
    <div class="mdl-content" id="mb"></div>
  </div>
</div>

<div id="cp">
  <div class="cph">
    <div class="logo" style="font-size:20px;">เปรียบเทียบสเปค</div>
    <button class="btn-clear" onclick="clearCmp()">🧹 ล้างข้อมูลทั้งหมด</button>
    <button class="mc" style="background:var(--bg3); border:1px solid var(--border); color:var(--dim); padding:5px 12px; cursor:pointer;" onclick="closeCp()">✕</button>
  </div>
  <div style="padding:24px; overflow-x:auto;"><div id="cpb"></div></div>
</div>

<script>
// ข้อ 3: ดึงข้อมูล Live และห้าม Cache
const SHEET_ID = '16A8YKMB1zLaURJH0cjZHR-MXdaIca_5kYRuilNIH-nw';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

let MS = [];
let curE = 'all', curQ = '', cmpSet = new Set();
let history = JSON.parse(localStorage.getItem('kf_history_v4') || '[]');

async function initData() {
  try {
    const res = await fetch(`${SHEET_URL}&t=${Date.now()}`, { cache: 'no-store' });
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    
    const rows = json.table.cols;
    const cols = json.table.rows.map(c => c.label || "");

    // Fixed Mapping Logic: ตรวจสอบคอลัมน์ทีละช่อง
    MS = rows.map((r, rowIndex) => {
      const data = {};
      r.c.forEach((cell, i) => {
        if (cols[i]) data[cols[i]] = cell ? (cell.f || cell.v || "-") : "-";
      });

      // ดึงค่าตามชื่อหัวข้อที่แน่นอน
      return {
        name: data['Model'] || data['รุ่น'] || r.c[0]?.v || "-",
        energy: data['ประเภทพลังงาน'] || "-",
        type: data['ประเภทของรถยก'] || "-",
        capacity: data['น้ำหนักของสัมภาระที่ยกได้สูงสุด(Q)กก.'] || "-",
        weight: data['น้ำหนักตัวรถ กก.'] || "-",
        turning: data['วงเลี้ยว (Wa) มม.'] || "-",
        grade: data['ความสามารถในการขึ้นทางลาดชัน มีสัมภาระ %'] || "-",
        spec: data
      };
    }).filter(m => m.name && m.name !== "-" && m.name !== "Model" && m.name !== "รุ่น");

    document.getElementById('loading').style.display = 'none';
    render();
  } catch (e) {
    document.getElementById('loading').innerHTML = `<p style="color:var(--red)">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
  }
}

function render() {
  const list = MS.filter(m => (curE === 'all' || m.energy === curE) && (!curQ || m.name.toLowerCase().includes(curQ)));
  document.getElementById('cnt').textContent = list.length + ' รุ่น';
  const g = document.getElementById('grid');
  
  g.innerHTML = list.map(m => {
    const isSel = cmpSet.has(m.name);
    return `
      <div class="card ${isSel ? 'sel' : ''}" onclick="openMdl('${m.name}')">
        <div class="card-title">${m.name}</div>
        <div class="card-energy">${m.energy}</div>
        
        <div class="spec-item">
          <span class="spec-label">น้ำหนักยก</span>
          <span class="spec-value">${m.capacity}</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">น้ำหนักรถ</span>
          <span class="spec-value">${m.weight}</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">วงเลี้ยว</span>
          <span class="spec-value">${m.turning} มม.</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">ทางลาด</span>
          <span class="spec-value">${m.grade} %</span>
        </div>
        
        <div class="card-btns">
          <button class="btn-text">ดูสเปคเต็ม</button>
          <button class="btn-add-cmp ${isSel ? 'on' : ''}" onclick="event.stopPropagation();togCmp('${m.name}')">
            ${isSel ? '✓ เลือกแล้ว' : '+ เปรียบเทียบ'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// ข้อ 4: History Management
function doF() {
  curQ = document.getElementById('search').value.toLowerCase();
  if (curQ.length > 1 && !history.includes(curQ)) {
    history.unshift(curQ);
    history = history.slice(0, 5);
    localStorage.setItem('kf_history_v4', JSON.stringify(history));
  }
  render();
}
function showHist() {
  if (history.length === 0) return;
  const hDiv = document.getElementById('search-history');
  hDiv.innerHTML = history.map(h => `<div class="hist-item" onmousedown="setSearch('${h}')">🕒 ${h}</div>`).join('');
  hDiv.style.display = 'block';
}
function hideHist() { setTimeout(() => document.getElementById('search-history').style.display = 'none', 200); }
function setSearch(val) { document.getElementById('search').value = val; curQ = val.toLowerCase(); render(); }

function setE(v, el) {
  curE = v;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  render();
}

// ข้อ 2: Modal Freeze Header
function openMdl(name) {
  const m = MS.find(x => x.name === name);
  document.getElementById('mt').textContent = m.name;
  document.getElementById('mb').innerHTML = Object.keys(m.spec).map(k => `
    <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--bg3); gap:15px;">
      <span style="color:var(--dim); font-size:15px; flex:1;">${k}</span>
      <span style="font-family:'JetBrains Mono'; color:var(--text); text-align:right;">${m.spec[k]}</span>
    </div>
  `).join('');
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMdl() { document.getElementById('ov').classList.remove('open'); document.body.style.overflow = 'auto'; }

// ข้อ 1: Clear & Back Home
function togCmp(name) {
  if (cmpSet.has(name)) cmpSet.delete(name);
  else { if (cmpSet.size >= 4) return alert('เปรียบเทียบได้สูงสุด 4 รุ่น'); cmpSet.add(name); }
  document.getElementById('cc').textContent = cmpSet.size;
  document.getElementById('cmp-badge').classList.toggle('on', cmpSet.size > 0);
  render();
}
function clearCmp() { cmpSet.clear(); document.getElementById('cc').textContent = '0'; document.getElementById('cmp-badge').classList.remove('on'); closeCp(); render(); }

function openCp() {
  const sel = [...cmpSet].map(n => MS.find(m => m.name === n));
  const keys = Object.keys(MS[0].spec);
  let h = `<table><tr><th style="background:var(--bg3)">หัวข้อสเปค</th>${sel.map(m => `<th>${m.name}</th>`).join('')}</tr>`;
  h += keys.map(k => `<tr><td>${k}</td>${sel.map(m => `<td>${m.spec[k]}</td>`).join('')}</tr>`).join('');
  h += `</table>`;
  document.getElementById('cpb').innerHTML = h;
  document.getElementById('cp').classList.add('open');
}
function closeCp() { document.getElementById('cp').classList.remove('open'); }

initData();
</script>
</body>
</html>
